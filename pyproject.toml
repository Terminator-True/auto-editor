[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "davinci-automation"
version = "0.1.0"
description = "Standalone read-only orchestrator for DaVinci Resolve automation (connection + timeline clip listing)."
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
davinci_automation = ["schemas/*.json", "templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["davinci_automation"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
